name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build StartupSelector.sln -c Release

      - name: Publish single-file exe
        run: dotnet publish src/StartupSelector -p:PublishProfile=SingleFile-win-x64

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: StartupSelector-win-x64
          path: src/StartupSelector/bin/publish/win-x64/StartupSelector.exe
          if-no-files-found: error
          retention-days: 14
